name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Builds Windows (installer + portable zip), Linux (AppImage), and
# macOS (Intel + Apple Silicon DMGs), then publishes all of them
# straight to a GitHub Release for this tag -- not just as workflow
# Artifacts. No manual upload step.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from tag
        run: |
          (Get-Content app/__init__.py) -replace '__version__ = ".*"', '__version__ = "${{ needs.prepare.outputs.version }}"' | Set-Content app/__init__.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller Pixen.spec

      - name: Create portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          Compress-Archive -Path dist\Pixen -DestinationPath dist-installer\Pixen-Windows-x64-Portable.zip
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\pixen.iss /DPixenVersion=${{ needs.prepare.outputs.version }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist-installer/Pixen-Setup.exe
            dist-installer/Pixen-Windows-x64-Portable.zip

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from tag
        run: sed -i 's/__version__ = ".*"/__version__ = "${{ needs.prepare.outputs.version }}"/' app/__init__.py

      - name: Install system Qt/AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 \
            fuse libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller Pixen.spec

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash installer/linux/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist-installer/Pixen-Linux-x86_64.AppImage

  build-macos-arm:
    needs: prepare
    runs-on: macos-14   # Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from tag
        run: sed -i '' 's/__version__ = ".*"/__version__ = "${{ needs.prepare.outputs.version }}"/' app/__init__.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate .icns app icon
        run: bash installer/macos/make_icns.sh

      - name: Build with PyInstaller
        run: pyinstaller Pixen.spec

      - name: Build DMG
        run: bash installer/macos/build_dmg.sh Pixen-macOS-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-arm64
          path: dist-installer/Pixen-macOS-arm64.dmg

  # Intel macOS runners (macos-13) have been suffering long GitHub-side
  # queue times (sometimes hours) as GitHub phases them out in favor of
  # Apple Silicon. `continue-on-error: true` + a firm timeout means a
  # stuck/queued Intel runner does NOT hold up the release: Windows,
  # Linux, and the Apple Silicon DMG still publish on time. If this job
  # times out or fails, re-run it individually later (Actions -> this
  # run -> "Re-run failed jobs") and re-run publish-release afterwards;
  # softprops/action-gh-release updates the existing release in place,
  # adding the Intel DMG without touching what's already published.
  build-macos-intel:
    needs: prepare
    runs-on: macos-13   # Intel (x86_64) runner
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from tag
        run: sed -i '' 's/__version__ = ".*"/__version__ = "${{ needs.prepare.outputs.version }}"/' app/__init__.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate .icns app icon
        run: bash installer/macos/make_icns.sh

      - name: Build with PyInstaller
        run: pyinstaller Pixen.spec

      - name: Build DMG
        run: bash installer/macos/build_dmg.sh Pixen-macOS-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-intel
          path: dist-installer/Pixen-macOS-x86_64.dmg

  publish-release:
    needs: [prepare, build-windows, build-linux, build-macos-arm, build-macos-intel]
    # Publish as soon as Windows, Linux, and the Apple Silicon DMG are
    # ready -- Intel's result is intentionally NOT required (see comment
    # above build-macos-intel). If Intel also succeeded in time, its
    # DMG is included automatically; if not, it just gets added to this
    # same release later.
    if: |
      always() &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos-arm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -R artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Pixen ${{ needs.prepare.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## Pixen ${{ needs.prepare.outputs.tag }}

            ### Downloads

            **Windows x64**
            - `Pixen-Setup.exe` — installer (choose install location, Start Menu shortcut, normal uninstall)
            - `Pixen-Windows-x64-Portable.zip` — no install, just extract and run `Pixen.exe`

            **Linux x86_64**
            - `Pixen-Linux-x86_64.AppImage` — download, `chmod +x`, run. No install needed.

            **macOS**
            - `Pixen-macOS-arm64.dmg` — Apple Silicon (M1/M2/M3/...)
            - `Pixen-macOS-x86_64.dmg` — Intel Macs (may be added shortly after the rest if GitHub's Intel runner queue was backed up)
          files: |
            artifacts/Pixen-Setup.exe
            artifacts/Pixen-Windows-x64-Portable.zip
            artifacts/Pixen-Linux-x86_64.AppImage
            artifacts/Pixen-macOS-*.dmg