name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Builds Windows (installer + portable zip), Linux (AppImage), and
# macOS (Intel + Apple Silicon DMGs), then publishes all of them
# straight to a GitHub Release for this tag -- not just as workflow
# Artifacts. No manual upload step.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from tag
        run: |
          (Get-Content app/__init__.py) -replace '__version__ = ".*"', '__version__ = "${{ needs.prepare.outputs.version }}"' | Set-Content app/__init__.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller Pixen.spec

      - name: Create portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          Compress-Archive -Path dist\Pixen -DestinationPath dist-installer\Pixen-Windows-x64-Portable.zip
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\pixen.iss /DPixenVersion=${{ needs.prepare.outputs.version }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist-installer/Pixen-Setup.exe
            dist-installer/Pixen-Windows-x64-Portable.zip

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from tag
        run: sed -i 's/__version__ = ".*"/__version__ = "${{ needs.prepare.outputs.version }}"/' app/__init__.py

      - name: Install system Qt/AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 \
            fuse libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller Pixen.spec

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash installer/linux/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist-installer/Pixen-Linux-x86_64.AppImage

  build-macos:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: macos-13    # Intel (x86_64) runner
            asset_name: Pixen-macOS-x86_64
          - os: macos-14    # Apple Silicon (arm64) runner
            asset_name: Pixen-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from tag
        run: sed -i '' 's/__version__ = ".*"/__version__ = "${{ needs.prepare.outputs.version }}"/' app/__init__.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate .icns app icon
        run: bash installer/macos/make_icns.sh

      - name: Build with PyInstaller
        run: pyinstaller Pixen.spec

      - name: Build DMG
        run: bash installer/macos/build_dmg.sh ${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.asset_name }}
          path: dist-installer/${{ matrix.asset_name }}.dmg

  publish-release:
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -R artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Pixen ${{ needs.prepare.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## Pixen ${{ needs.prepare.outputs.tag }}

            ### Downloads

            **Windows x64**
            - `Pixen-Setup.exe` — installer (choose install location, Start Menu shortcut, normal uninstall)
            - `Pixen-Windows-x64-Portable.zip` — no install, just extract and run `Pixen.exe`

            **Linux x86_64**
            - `Pixen-Linux-x86_64.AppImage` — download, `chmod +x`, run. No install needed.

            **macOS**
            - `Pixen-macOS-arm64.dmg` — Apple Silicon (M1/M2/M3/...)
            - `Pixen-macOS-x86_64.dmg` — Intel Macs
          files: |
            artifacts/Pixen-Setup.exe
            artifacts/Pixen-Windows-x64-Portable.zip
            artifacts/Pixen-Linux-x86_64.AppImage
            artifacts/Pixen-macOS-arm64.dmg
            artifacts/Pixen-macOS-x86_64.dmg
