[project]
name = "pixen"
version = "0.1.0"
description = "Pixen -- a modern, minimal, local-first paint app."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pixen" }]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
]

[project.scripts]
pixen = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]
